<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MolarisStock — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg-void:#0d0818; --bg-void-2:#140c26; --surface:#1b1233; --border:rgba(147,112,255,0.22); --violet:#7c3aed; --violet-bright:#9b6bff; --cyan:#22d3ee; --text-1:#f4f1ff; --text-2:#b6ace0; --text-3:#7a71a3; --radius:16px; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ font-family:'Inter',sans-serif; background:linear-gradient(160deg, var(--bg-void) 0%, var(--bg-void-2) 100%); display:flex; align-items:center; justify-content:center; }
  .card{ width:100%; max-width:400px; background:linear-gradient(180deg, rgba(36,26,66,0.85), rgba(27,18,51,0.9)); border:1px solid var(--border); border-radius:var(--radius); padding:40px 36px; backdrop-filter:blur(18px); }
  .brand{ text-align:center; margin-bottom:30px; }
  .logo-ring{ width:60px; height:60px; margin:0 auto 16px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg, var(--violet), #4c1d95); }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--text-3); margin-bottom:7px; }
  .field input{ width:100%; padding:13px 14px; background:rgba(13,8,24,0.6); border:1px solid var(--border); border-radius:10px; color:var(--text-1); }
  .btn{ width:100%; padding:13px 14px; border-radius:10px; cursor:pointer; border:none; font-weight:600; margin-top:10px; }
  .btn-primary{ background:linear-gradient(135deg, var(--violet-bright), var(--violet)); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--text-2); border:1px solid var(--border); margin-top:10px;}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo-ring"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="white" stroke-width="2"><path d="M9 2v6.2L4.5 17a2 2 0 0 0 1.8 2.9h11.4A2 2 0 0 0 19.5 17L15 8.2V2"/><path d="M8.5 2h7"/><path d="M7 15h10"/></svg></div>
    <h1>MolarisStock</h1>
    <p>Bem-vindo, cientista</p>
  </div>

  <form id="form-login" onsubmit="fazerLogin(event)">
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Sua senha secreta" required>
    </div>
    <button type="submit" class="btn btn-primary">Entrar no Sistema</button>
  </form>
  <button type="button" class="btn btn-ghost" onclick="cadastrar()">Criar meu acesso</button>
</div>

<script>
  async function fazerLogin(evento) {
    evento.preventDefault();
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const res = await fetch('http://localhost:3000/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const dados = await res.json();
    if (res.ok) {
      sessionStorage.setItem('usuario', dados.usuario);
      window.location.href = 'index.html';
    } else { alert(dados.erro); }
  }

  async function cadastrar() {
    const nome = prompt("Qual o seu nome?");
    const email = prompt("Qual o e-mail?");
    const senha = prompt("Qual a senha?");
    if(!nome || !email || !senha) return;
    const res = await fetch('http://localhost:3000/cadastrar-usuario', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, email, senha })
    });
    const dados = await res.json();
    alert(dados.mensagem || dados.erro);
  }
</script>
</body>
</html>
