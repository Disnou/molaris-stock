<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MolarisStock — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0d0818;
    --bg-void-2:#140c26;
    --surface:#1b1233;
    --surface-2:#241a42;
    --border:rgba(147,112,255,0.22);
    --border-strong:rgba(167,139,250,0.45);
    --violet:#7c3aed;
    --violet-bright:#9b6bff;
    --violet-glow:#a78bfa;
    --cyan:#22d3ee;
    --text-1:#f4f1ff;
    --text-2:#b6ace0;
    --text-3:#7a71a3;
    --danger:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 12% 18%, rgba(124,58,237,0.35), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(34,211,238,0.16), transparent 45%),
      linear-gradient(160deg, var(--bg-void) 0%, var(--bg-void-2) 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:24px;
  }
  /* molecular dot grid */
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(167,139,250,0.16) 1px, transparent 1.4px);
    background-size:26px 26px;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events:none;
  }
  /* faint connecting molecule lines top-right */
  .mol-deco{
    position:absolute;
    top:-40px; right:-60px;
    width:420px; height:420px;
    opacity:0.35;
    pointer-events:none;
  }
  .mol-deco svg{width:100%;height:100%;}

  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, rgba(36,26,66,0.85), rgba(27,18,51,0.9));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:40px 36px 32px;
    backdrop-filter:blur(18px);
    box-shadow:
      0 0 0 1px rgba(124,58,237,0.06),
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 60px -10px rgba(124,58,237,0.25);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:var(--radius);
    padding:1px;
    background:linear-gradient(135deg, rgba(167,139,250,0.5), transparent 40%, transparent 60%, rgba(34,211,238,0.3));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:30px;
  }
  .logo-ring{
    width:60px; height:60px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--violet), #4c1d95);
    box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset, 0 8px 30px -6px rgba(124,58,237,0.7);
    margin-bottom:16px;
  }
  .logo-ring svg{width:30px;height:30px;}
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--text-1);
    margin:0 0 6px;
  }
  .brand p{
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.06em;
    color:var(--cyan);
    text-transform:uppercase;
  }

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-3);
    margin-bottom:7px;
  }
  .field input{
    width:100%;
    padding:13px 14px;
    background:rgba(13,8,24,0.6);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-1);
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{color:var(--text-3);}
  .field input:focus{
    border-color:var(--violet-bright);
    box-shadow:0 0 0 3px rgba(124,58,237,0.25);
  }

  .btn{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    font-size:14.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    border:none;
    cursor:pointer;
    transition:transform .12s, box-shadow .15s, background .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(135deg, var(--violet-bright), var(--violet));
    color:#fff;
    box-shadow:0 10px 25px -8px rgba(124,58,237,0.7);
    margin-top:6px;
  }
  .btn-primary:hover{box-shadow:0 14px 30px -6px rgba(124,58,237,0.9);}
  .btn-ghost{
    background:transparent;
    color:var(--text-2);
    border:1px solid var(--border);
    margin-top:10px;
  }
  .btn-ghost:hover{border-color:var(--border-strong); color:var(--text-1);}

  .divider{
    display:flex; align-items:center; gap:10px;
    margin:22px 0 18px;
    color:var(--text-3);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }

  .footnote{
    text-align:center;
    margin-top:22px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-3);
  }
</style>
</head>
<body>

<div class="mol-deco">
  <svg viewBox="0 0 200 200" fill="none">
    <circle cx="40" cy="40" r="4" fill="#a78bfa"/>
    <circle cx="120" cy="60" r="3" fill="#22d3ee"/>
    <circle cx="90" cy="130" r="4" fill="#a78bfa"/>
    <circle cx="160" cy="140" r="3" fill="#7c3aed"/>
    <circle cx="150" cy="30" r="2.5" fill="#a78bfa"/>
    <line x1="40" y1="40" x2="120" y2="60" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="60" x2="90" y2="130" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <line x1="90" y1="130" x2="160" y2="140" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="60" x2="150" y2="30" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  </svg>
</div>

<div class="card">
  <div class="brand">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2v6.2L4.5 17a2 2 0 0 0 1.8 2.9h11.4A2 2 0 0 0 19.5 17L15 8.2V2"/>
        <path d="M8.5 2h7"/>
        <path d="M7 15h10"/>
      </svg>
    </div>
    <h1>MolarisStock</h1>
    <p>Bem-vindo, cientista</p>
  </div>

  <div class="field" id="campo-nome" style="display:none;">
    <label>Nome</label>
    <input type="text" id="nome" placeholder="Seu nome completo">
  </div>
  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="Sua senha secreta">
  </div>

  <button class="btn btn-primary" id="btn-entrar" onclick="logar()">Entrar no Sistema</button>
  <button class="btn btn-ghost" id="btn-cadastro" onclick="alternarCadastro()">Criar meu acesso</button>

  <div class="divider">Controle laboratorial seguro</div>

  <p class="footnote">MolarisStock v1.0 · Gestão de reagentes</p>
</div>

<script src="login.js"></script>
</body>
</html>
