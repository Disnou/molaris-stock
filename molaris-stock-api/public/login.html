<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MolarisStock — Login Laboratorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg-void:#090514;
    --bg-void-2:#130b24;
    --surface:#1a1130;
    --surface-2:#241942;
    --border:rgba(147,112,255,0.25);
    --border-strong:rgba(167,139,250,0.5);
    --violet:#7c3aed;
    --violet-bright:#9b6bff;
    --violet-glow:#a78bfa;
    --cyan:#22d3ee;
    --cyan-glow:rgba(34,211,238,0.3);
    --text-1:#ffffff;
    --text-2:#d6d0f0;
    --text-3:#9b92c4;
    --danger:#f87171;
    --success:#34d399;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;color-scheme:dark;}
  body{
    font-family:'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background:
      radial-gradient(circle at 10% 15%, rgba(124,58,237,0.38), transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(34,211,238,0.18), transparent 45%),
      linear-gradient(160deg, var(--bg-void) 0%, var(--bg-void-2) 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding:20px;
  }
  
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(167,139,250,0.15) 1px, transparent 1.5px);
    background-size:28px 28px;
    mask-image:radial-gradient(ellipse at center, black 35%, transparent 80%);
    pointer-events:none;
  }

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, rgba(32,22,58,0.85), rgba(22,14,42,0.92));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:38px 34px 30px;
    backdrop-filter:blur(20px);
    box-shadow:
      0 0 0 1px rgba(124,58,237,0.08),
      0 25px 60px -15px rgba(0,0,0,0.7),
      0 0 50px -10px rgba(124,58,237,0.3);
    z-index:2;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:26px;
  }
  .logo-ring{
    width:62px; height:62px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--violet), #4c1d95);
    box-shadow:0 0 0 1px rgba(255,255,255,0.12) inset, 0 10px 30px -6px rgba(124,58,237,0.8);
    margin-bottom:14px;
    position:relative;
  }
  .logo-ring svg{width:32px;height:32px;}
  
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:25px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--text-1);
    margin:0 0 4px;
  }
  .brand p{
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--cyan);
    text-transform:uppercase;
  }

  .badge-compliance{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(34,211,238,0.1);
    border:1px solid rgba(34,211,238,0.25);
    padding:4px 10px;
    border-radius:100px;
    font-size:10.5px;
    font-family:'JetBrains Mono',monospace;
    color:var(--cyan);
    margin-top:8px;
  }

  .field{margin-bottom:15px;}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-3);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    background:rgba(12,7,24,0.7);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-1);
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field select{
    color:var(--text-2);
    cursor:pointer;
  }
  .field input:focus, .field select:focus{
    border-color:var(--violet-bright);
    box-shadow:0 0 0 3px rgba(124,58,237,0.25);
  }
  .field input::placeholder{color:var(--text-3);}

  .btn{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    border:none;
    cursor:pointer;
    transition:transform .12s, box-shadow .15s, background .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(135deg, var(--violet-bright), var(--violet));
    color:#fff;
    box-shadow:0 8px 25px -6px rgba(124,58,237,0.7);
    margin-top:6px;
  }
  .btn-primary:hover{box-shadow:0 12px 28px -5px rgba(124,58,237,0.9);}
  
  .btn-ghost{
    background:transparent;
    color:var(--text-2);
    border:1px solid var(--border);
    margin-top:10px;
  }
  .btn-ghost:hover{border-color:var(--border-strong); color:var(--text-1); background:rgba(124,58,237,0.08);}

  .alert-box{
    display:none;
    background:rgba(248,113,113,0.12);
    border:1px solid rgba(248,113,113,0.35);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:16px;
    font-size:12.5px;
    color:var(--danger);
    line-height:1.4;
  }

  .divider{
    display:flex; align-items:center; gap:10px;
    margin:20px 0 16px;
    color:var(--text-3);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }

  .footnote{
    text-align:center;
    margin-top:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-3);
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2v6.2L4.5 17a2 2 0 0 0 1.8 2.9h11.4A2 2 0 0 0 19.5 17L15 8.2V2"/>
        <path d="M8.5 2h7"/>
        <path d="M7 15h10"/>
      </svg>
    </div>
    <h1>MolarisStock</h1>
    <p id="txt-subtitulo">Sistema de Gestão Laboratorial</p>
    <div class="badge-compliance">
      <span>🛡️</span> PF · Exército · PC · ANVISA
    </div>
  </div>

  <div id="alert-box" class="alert-box"></div>

  <div class="field" id="campo-nome" style="display:none;">
    <label>Nome Completo</label>
    <input type="text" id="nome" placeholder="Dr(a). Nome do Cientista">
  </div>

  <div class="field" id="campo-cargo" style="display:none;">
    <label>Função / Cargo</label>
    <select id="cargo">
      <option value="Responsável Técnico (CRQ/CRF)">Responsável Técnico (CRQ / CRF / CRBio)</option>
      <option value="Cientista / Analista" selected>Cientista / Analista Químico</option>
      <option value="Auditor de Qualidade">Auditor de Qualidade / BPF</option>
      <option value="Técnico de Laboratório">Técnico de Laboratório</option>
    </select>
  </div>

  <div class="field">
    <label>E-mail Institucional</label>
    <input type="email" id="email" placeholder="cientista@laboratorio.com">
  </div>

  <div class="field">
    <label>Senha de Acesso</label>
    <input type="password" id="senha" placeholder="••••••••">
  </div>

  <button class="btn btn-primary" id="btn-entrar" onclick="logar()">Entrar no Sistema</button>
  <button class="btn btn-ghost" id="btn-cadastro" onclick="alternarCadastro()">Criar meu acesso</button>

  <div class="divider">Controle Laboratorial Rastreável</div>

  <p class="footnote">MolarisStock v2.0 Enterprise · Keep-Alive 24/7</p>
</div>

<script src="login.js"></script>
</body>
</html>
