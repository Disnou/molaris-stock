<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MolarisStock — Painel de Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0d0818;
    --bg-void-2:#140c26;
    --surface:#1b1233;
    --surface-2:#241a42;
    --border:rgba(147,112,255,0.18);
    --border-strong:rgba(167,139,250,0.4);
    --violet:#7c3aed;
    --violet-bright:#9b6bff;
    --violet-glow:#a78bfa;
    --cyan:#22d3ee;
    --text-1:#f4f1ff;
    --text-2:#b6ace0;
    --text-3:#7a71a3;
    --danger:#f87171;
    --danger-bg:rgba(248,113,113,0.12);
    --warning:#fbbf24;
    --warning-bg:rgba(251,191,36,0.12);
    --success:#34d399;
    --success-bg:rgba(52,211,153,0.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    color:var(--text-1);
    background:
      radial-gradient(circle at 8% 0%, rgba(124,58,237,0.25), transparent 38%),
      radial-gradient(circle at 95% 30%, rgba(34,211,238,0.10), transparent 40%),
      linear-gradient(160deg, var(--bg-void) 0%, var(--bg-void-2) 100%);
    background-attachment:fixed;
    padding:0 0 60px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(167,139,250,0.10) 1px, transparent 1.4px);
    background-size:28px 28px;
    mask-image:radial-gradient(ellipse at 20% 10%, black 0%, transparent 55%);
    pointer-events:none;
  }
 
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 40px;
    border-bottom:1px solid var(--border);
    background:rgba(13,8,24,0.5);
    backdrop-filter:blur(10px);
    position:relative;
    z-index:2;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .logo-ring{
    width:38px;height:38px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg, var(--violet), #4c1d95);
    box-shadow:0 6px 18px -4px rgba(124,58,237,0.7);
  }
  .logo-ring svg{width:20px;height:20px;}
  .brand-text h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand-text span{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--cyan);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .top-right { display: flex; align-items: center; }
  .btn-lang { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-right: 15px; font-family: 'JetBrains Mono', monospace; font-size: 11px;}
  .btn-lang:hover { background: rgba(34,211,238,0.15); }

  .user-chip{
    display:flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--text-2);
    background:var(--surface);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:100px;
  }
  .user-chip .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--success);
    box-shadow:0 0 8px var(--success);
  }
 
  .container{
    max-width:1180px;
    margin:36px auto 0;
    padding:0 40px;
    position:relative;
    z-index:2;
  }
 
  .panel{
    background:linear-gradient(180deg, rgba(36,26,66,0.6), rgba(27,18,51,0.6));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 28px;
    margin-bottom:22px;
    backdrop-filter:blur(14px);
  }
  .panel-title{
    display:flex;align-items:center;gap:9px;
    font-family:'Space Grotesk',sans-serif;
    font-size:15.5px;
    font-weight:600;
    color:var(--text-1);
    margin:0 0 18px;
  }
  .panel-title::before{
    content:"";
    width:6px;height:6px;border-radius:2px;
    background:var(--violet-bright);
    box-shadow:0 0 8px var(--violet-bright);
  }
 
  .form-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .form-row select,
  .form-row input{
    background:rgba(13,8,24,0.6);
    border:1px solid var(--border);
    border-radius:9px;
    color:var(--text-1);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    padding:11px 13px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .form-row select:focus,
  .form-row input:focus{
    border-color:var(--violet-bright);
    box-shadow:0 0 0 3px rgba(124,58,237,0.2);
  }
  .form-row select{flex:1.3;min-width:170px;color:var(--text-2);}
  .form-row input[data-type="lote"]{flex:1.3;min-width:150px;font-family:'JetBrains Mono',monospace;}
  .form-row input[data-type="qtd"]{flex:0.8;min-width:100px;font-family:'JetBrains Mono',monospace;}
  .form-row input[data-type="data"]{flex:0.9;min-width:130px;font-family:'JetBrains Mono',monospace;color:var(--text-2);}
 
  .btn{
    border:none;
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    padding:11px 20px;
    white-space:nowrap;
    transition:transform .12s, box-shadow .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(135deg, var(--violet-bright), var(--violet));
    color:#fff;
    box-shadow:0 8px 20px -6px rgba(124,58,237,0.7);
  }
  .btn-primary:hover{box-shadow:0 10px 24px -4px rgba(124,58,237,0.9);}
  
  .btn-outline {
    background:transparent;
    color:var(--text-1);
    border:1px solid var(--border-strong);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .btn-outline:hover { background:rgba(124,58,237,0.15); border-color:var(--violet-bright); }

  .toolbar-row {
    display:flex;
    gap:12px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .search-wrap{position:relative; flex:1; min-width:250px;}
  .search-wrap svg{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--text-3);
  }
  .search-wrap input{
    width:100%;
    padding:13px 16px 13px 44px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:11px;
    color:var(--text-1);
    font-size:14px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--violet-bright); box-shadow:0 0 0 3px rgba(124,58,237,0.18);}
  .search-wrap input::placeholder{color:var(--text-3);}
 
  .table-wrapper {
    width: 100%;
    overflow-x: auto;
  }
  table{width:100%;border-collapse:collapse; min-width: 800px;}
  thead tr{
    background:linear-gradient(90deg, #3a2266, #241a42);
  }
  th{
    text-align:left;
    padding:13px 18px;
    font-size:11px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--violet-glow);
    font-weight:600;
  }
  th:first-child{border-radius:10px 0 0 10px;}
  th:last-child{border-radius:0 10px 10px 0;}
 
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:rgba(124,58,237,0.06);}
  td{padding:16px 18px;font-size:13.5px;vertical-align:middle;}
  td.reagente{font-weight:600;color:var(--text-1);}
  td.lote,td.validade,td.qtd{font-family:'JetBrains Mono',monospace;color:var(--text-2);font-size:13px;}
  td.qtd{font-weight:600;}
 
  .qtd-critico{color:var(--danger);}
  .qtd-ok{color:var(--success);}
 
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;
    border-radius:100px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-warning{background:var(--warning-bg);color:var(--warning);}
  .badge-success{background:var(--success-bg);color:var(--success);}
 
  .acoes{display:flex;align-items:center;gap:8px;}
  .acoes input{
    width:64px;
    padding:9px 10px;
    background:rgba(13,8,24,0.6);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text-1);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    outline:none;
  }
  .acoes input:focus{border-color:var(--violet-bright);}
  .btn-sm{
    padding:8px 14px;
    font-size:12px;
    border-radius:8px;
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  .btn-usar{background:linear-gradient(135deg,#22d3ee,#0ea5c4);color:#04202b;}
  .btn-excluir{background:transparent;border:1px solid rgba(248,113,113,0.4);color:var(--danger);}
  .btn-excluir:hover{background:var(--danger-bg);}

  @media (max-width: 768px) {
    .topbar { padding: 16px 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
    .container { padding: 0 16px; margin-top: 20px; }
    .form-row { flex-direction: column; }
    .form-row select, .form-row input, .form-row button { width: 100%; flex: none; }
    .toolbar-row { flex-direction: column; }
    .btn-outline { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
 
<div class="topbar">
  <div class="brand">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2v6.2L4.5 17a2 2 0 0 0 1.8 2.9h11.4A2 2 0 0 0 19.5 17L15 8.2V2"/>
        <path d="M8.5 2h7"/>
        <path d="M7 15h10"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>MolarisStock</h1>
      <span id="txt-subtitulo">Painel de Controle</span>
    </div>
  </div>
  <div class="top-right">
    <button class="btn-lang" onclick="alternarIdioma()" id="btn-idioma">EN</button>
    <div class="user-chip">
      <span class="dot"></span>
      <span id="nome-cientista">Cientista logado...</span>
    </div>
  </div>
</div>
 
<div class="container">
 
  <div class="panel">
    <p class="panel-title" id="txt-nova-entrada">Dar entrada em novo lote</p>
    <div class="form-row">
      <select id="novo_reagente" required><option value="" disabled selected id="txt-sel-reagente">Selecione o reagente...</option></select>
      <input type="text" data-type="lote" id="novo_lote" placeholder="Ex: LOTE-ABC-123" required>
      <input type="number" data-type="qtd" id="nova_qtd" placeholder="Qtd total" required min="1">
      <input type="date" data-type="data" id="nova_validade" required>
      <button class="btn btn-primary" onclick="cadastrarLote()" id="txt-btn-cadastrar">+ Cadastrar / Repor</button>
    </div>
  </div>
 
  <div class="toolbar-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="pesquisa" placeholder="Pesquisar reagente pelo nome ou lote..." onkeyup="filtrarTabela()">
    </div>
    <button class="btn btn-outline" onclick="exportarExcel()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
      <span id="txt-btn-exportar">Exportar CSV</span>
    </button>
  </div>
 
  <div class="panel" style="padding:0; overflow:hidden;">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th id="th-reagente">Reagente</th>
            <th id="th-lote">Lote</th>
            <th id="th-validade">Validade</th>
            <th id="th-qtd">Qtd atual</th>
            <th id="th-status">Status</th>
            <th id="th-acoes">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-estoque">
        </tbody>
      </table>
    </div>
  </div>
 
</div>

<script>
    // --- DICIONÁRIO DE TRADUÇÃO DA INTERFACE ---
    const dict = {
        pt: {
            subtitulo: "Painel de Controle", logado: "Cientista logado:", novaEntrada: "Dar entrada em novo lote",
            selReagente: "Selecione o reagente...", btnCadastrar: "+ Cadastrar / Repor",
            phPesquisa: "Pesquisar reagente pelo nome ou lote...", btnExportar: "Exportar CSV",
            thReagente: "Reagente", thLote: "Lote", thValidade: "Validade", thQtd: "Qtd atual", thStatus: "Status", thAcoes: "Ações",
            badgeSaudavel: "● Estoque saudável", badgeVencido: "● Vencido", badgeCorrigir: "● Corrigir estoque", badgeBaixo: "● Estoque baixo",
            btnUsar: "Usar", btnExcluir: "Excluir", semData: "Sem data"
        },
        en: {
            subtitulo: "Dashboard", logado: "Logged in scientist:", novaEntrada: "Register new batch",
            selReagente: "Select reagent...", btnCadastrar: "+ Register / Replenish",
            phPesquisa: "Search reagent by name or batch...", btnExportar: "Export CSV",
            thReagente: "Reagent", thLote: "Batch", thValidade: "Expiry Date", thQtd: "Current Qty", thStatus: "Status", thAcoes: "Actions",
            badgeSaudavel: "● Healthy stock", badgeVencido: "● Expired", badgeCorrigir: "● Fix stock", badgeBaixo: "● Low stock",
            btnUsar: "Use", btnExcluir: "Delete", semData: "No date"
        }
    };

    // --- DICIONÁRIO DO BANCO DE DADOS ---
    function traduzirReagente(nomeBanco) {
        if (idiomaAtual === 'pt') return nomeBanco;
        
        const traducoes = {
            "Ácido Clorídrico 37%": "Hydrochloric Acid 37%",
            "Hidróxido de Sódio P.A.": "Sodium Hydroxide P.A.",
            "Ácido Sulfúrico 98%": "Sulfuric Acid 98%",
            "Etanol Absoluto": "Absolute Ethanol",
            "Cloreto de Sódio": "Sodium Chloride",
            "Ácido Nítrico 65%": "Nitric Acid 65%",
            "Sulfato de Cobre": "Copper Sulfate",
            "Amônia 25%": "Ammonia 25%"
        };
        return traducoes[nomeBanco] || nomeBanco; 
    }

    let idiomaAtual = 'pt';
    let nomeCientista = sessionStorage.getItem('usuario') || 'Visitante';

    function alternarIdioma() {
        idiomaAtual = idiomaAtual === 'pt' ? 'en' : 'pt';
        document.getElementById('btn-idioma').innerText = idiomaAtual === 'pt' ? 'EN' : 'PT';
        
        // Atualiza textos fixos
        document.getElementById('txt-subtitulo').innerText = dict[idiomaAtual].subtitulo;
        document.getElementById('nome-cientista').innerText = `${dict[idiomaAtual].logado} ${nomeCientista}`;
        document.getElementById('txt-nova-entrada').innerText = dict[idiomaAtual].novaEntrada;
        document.getElementById('txt-sel-reagente').innerText = dict[idiomaAtual].selReagente;
        document.getElementById('txt-btn-cadastrar').innerText = dict[idiomaAtual].btnCadastrar;
        document.getElementById('pesquisa').placeholder = dict[idiomaAtual].phPesquisa;
        document.getElementById('txt-btn-exportar').innerText = dict[idiomaAtual].btnExportar;
        
        // Atualiza tabela (cabeçalhos)
        document.getElementById('th-reagente').innerText = dict[idiomaAtual].thReagente;
        document.getElementById('th-lote').innerText = dict[idiomaAtual].thLote;
        document.getElementById('th-validade').innerText = dict[idiomaAtual].thValidade;
        document.getElementById('th-qtd').innerText = dict[idiomaAtual].thQtd;
        document.getElementById('th-status').innerText = dict[idiomaAtual].thStatus;
        document.getElementById('th-acoes').innerText = dict[idiomaAtual].thAcoes;

        // Recarrega os dados para aplicar tradução na tabela e no select
        carregarReagentes();
        carregarEstoque();
    }

    // --- LÓGICA DO SISTEMA ---
    if(!sessionStorage.getItem('usuario')) window.location.href = 'login.html'; 
    document.getElementById('nome-cientista').innerText = `${dict[idiomaAtual].logado} ${nomeCientista}`;

    async function carregarReagentes() {
        try {
            const res = await fetch('http://localhost:3000/reagentes');
            const reagentes = await res.json();
            const select = document.getElementById('novo_reagente');
            select.innerHTML = `<option value="" disabled selected id="txt-sel-reagente">${dict[idiomaAtual].selReagente}</option>`;
            reagentes.forEach(r => {
                select.innerHTML += `<option value="${r.id}">${traduzirReagente(r.nome)}</option>`;
            });
        } catch(e) { console.error("Erro:", e); }
    }

    async function carregarEstoque() {
        try {
            const res = await fetch('http://localhost:3000/estoque');
            const dados = await res.json();
            const corpo = document.getElementById('tabela-estoque');
            corpo.innerHTML = ''; 
            const hoje = new Date();

            dados.forEach(item => {
                let dataFormatada = dict[idiomaAtual].semData;
                let classeBadge = 'badge-success';
                let textoBadge = dict[idiomaAtual].badgeSaudavel;
                let classeQtd = 'qtd-ok';

                if (item.data_validade) {
                    const dataV = new Date(item.data_validade);
                    dataFormatada = dataV.toLocaleDateString(idiomaAtual === 'pt' ? 'pt-BR' : 'en-US', { timeZone: 'UTC' });
                    dataV.setHours(0,0,0,0); hoje.setHours(0,0,0,0);
                    if (dataV < hoje) { classeBadge = 'badge-danger'; textoBadge = dict[idiomaAtual].badgeVencido; }
                }

                if(item.quantidade_atual <= 0) {
                    classeQtd = 'qtd-critico'; classeBadge = 'badge-danger'; textoBadge = dict[idiomaAtual].badgeCorrigir;
                } else if (item.quantidade_atual < 50) { 
                    classeBadge = 'badge-warning'; textoBadge = dict[idiomaAtual].badgeBaixo; classeQtd = '';
                }

                corpo.innerHTML += `
                    <tr>
                        <td class="reagente">${traduzirReagente(item.nome)}</td>
                        <td class="lote">${item.numero_lote}</td>
                        <td class="validade">${dataFormatada}</td>
                        <td class="qtd ${classeQtd}">${item.quantidade_atual} ${item.unidade_base}</td>
                        <td><span class="badge ${classeBadge}">${textoBadge.replace('● ', '')}</span></td>
                        <td class="acoes">
                            <input type="number" id="input-${item.numero_lote}" placeholder="Qtd" min="1">
                            <button class="btn-sm btn-usar" onclick="darBaixa('${item.numero_lote}')">${dict[idiomaAtual].btnUsar}</button>
                            <button class="btn-sm btn-excluir" onclick="excluirLote('${item.numero_lote}')">${dict[idiomaAtual].btnExcluir}</button>
                        </td>
                    </tr>`;
            });
        } catch(e) { console.error("Erro:", e); }
    }

    async function cadastrarLote() {
        const idReagente = document.getElementById('novo_reagente').value;
        const lote = document.getElementById('novo_lote').value;
        const qtd = document.getElementById('nova_qtd').value;
        const validade = document.getElementById('nova_validade').value;

        if(!idReagente || !lote || !qtd || !validade) {
            alert(idiomaAtual === 'pt' ? "Preencha todos os campos!" : "Fill all fields!");
            return;
        }

        const body = { reagente_id: idReagente, numero_lote: lote, quantidade_atual: qtd, data_validade: validade };

        try {
            const res = await fetch('http://localhost:3000/novo-lote', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            if(res.ok) {
                document.getElementById('novo_lote').value = '';
                document.getElementById('nova_qtd').value = '';
                document.getElementById('nova_validade').value = '';
                carregarEstoque(); 
            } else { const erro = await res.json(); alert(erro.erro); }
        } catch(e) { alert("Erro de conexão."); }
    }

    async function darBaixa(lote) {
        const qtd = document.getElementById(`input-${lote}`).value;
        if(!qtd || qtd <= 0) return;
        try {
            const res = await fetch('http://localhost:3000/baixar-estoque', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({numero_lote: lote, quantidade_usada: qtd}) });
            if(res.ok) carregarEstoque(); else { const erro = await res.json(); alert(erro.erro); }
        } catch(e) { alert("Erro de conexão."); }
    }

    async function excluirLote(lote) {
        const msg = idiomaAtual === 'pt' ? `ATENÇÃO: Deseja EXCLUIR o lote ${lote}?` : `WARNING: Delete batch ${lote}?`;
        if(confirm(msg)) {
            await fetch(`http://localhost:3000/excluir-lote/${lote}`, { method: 'DELETE' });
            carregarEstoque();
        }
    }

    function filtrarTabela() {
        const texto = document.getElementById('pesquisa').value.toLowerCase();
        document.querySelectorAll('#tabela-estoque tr').forEach(linha => {
            linha.style.display = linha.innerText.toLowerCase().includes(texto) ? '' : 'none';
        });
    }

    function exportarExcel() {
        const linhas = document.querySelectorAll('#tabela-estoque tr');
        let csv = `${dict[idiomaAtual].thReagente};${dict[idiomaAtual].thLote};${dict[idiomaAtual].thValidade};Quantidade;${dict[idiomaAtual].thStatus}\n`;
        linhas.forEach(linha => {
            if (linha.style.display !== 'none') {
                const cols = linha.querySelectorAll('td');
                csv += `${cols[0].innerText.replace(/;/g, '')};${cols[1].innerText.replace(/;/g, '')};${cols[2].innerText.replace(/;/g, '')};${cols[3].innerText.replace(/;/g, '')};${cols[4].innerText.replace(/;/g, '')}\n`;
            }
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = `MolarisStock_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`;
        link.click();
    }

    carregarReagentes();
    carregarEstoque();
</script>
